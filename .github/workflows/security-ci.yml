name: Security Pipeline

on:
  push:
    branches: [main, develop]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-backend:latest
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend:latest

jobs:

  # ─── SAST — SonarCloud (Q4 — Static Analysis) ────────────────────────────
  sast:
    name: SAST — SonarCloud
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[sast]') || contains(github.event.head_commit.message, '[security]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend for SonarCloud
        working-directory: ./travelo_backend
        run: mvn package -DskipTests -B

      - name: SonarCloud scan — Backend
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: travelo_backend
          args: >
            -Dsonar.projectKey=travelo-backend
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud scan — Frontend
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: travelo_frontend
          args: >
            -Dsonar.projectKey=travelo-frontend
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.qualitygate.wait=true

  # ─── SCA — OWASP Dependency Check (Q4 — Dependencies) ───────────────────
  sca:
    name: SCA — Dependency Check
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[sca]') || contains(github.event.head_commit.message, '[security]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check — Backend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: travelo-backend
          path: travelo_backend
          format: HTML
          args: >
            --failOnCVSS 5
            --enableRetired

      - name: Upload backend SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report-backend
          path: reports/

      - name: npm audit — Frontend
        working-directory: ./travelo_frontend
        run: |
          npm ci
          npm audit --audit-level=high --json > npm-audit-report.json || true
          cat npm-audit-report.json

      - name: Upload frontend audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: travelo_frontend/npm-audit-report.json

  # ─── Container Security — Trivy (Q4 — Images) ────────────────────────────
  container-scan:
    name: Container Security — Trivy
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[scan]') || contains(github.event.head_commit.message, '[security]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy scan — Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'             # Q4b — blocks pipeline if CVSS > 5
          ignore-unfixed: true

      - name: Upload backend Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Trivy scan — Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'             # Q4b — blocks pipeline if CVSS > 5
          ignore-unfixed: true

      - name: Upload frontend Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ─── DAST — OWASP ZAP (Q4 — Runtime) ────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[dast]') || contains(github.event.head_commit.message, '[security]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application
        run: |
          docker compose up -d
          echo "Waiting for app to be ready..."
          timeout 90 bash -c 'until curl -sf http://localhost; do sleep 3; done'
          echo "App is up"

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'
          fail_action: false         # report only — don't block pipeline
          cmd_options: '-a'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Stop application
        if: always()
        run: docker compose down

  # ─── Quality Gate — block on critical CVEs (Q4b) ─────────────────────────
  quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, container-scan]
    if: always() && (contains(github.event.head_commit.message, '[security]'))

    steps:
      - name: Evaluate security results
        run: |
          echo "SAST result:      ${{ needs.sast.result }}"
          echo "SCA result:       ${{ needs.sca.result }}"
          echo "Container result: ${{ needs.container-scan.result }}"

          if [ "${{ needs.container-scan.result }}" = "failure" ]; then
            echo "BLOCKED: critical/high CVEs found in Docker images"
            exit 1
          fi
          if [ "${{ needs.sca.result }}" = "failure" ]; then
            echo "BLOCKED: dependency vulnerabilities with CVSS > 5"
            exit 1
          fi
          echo "All security checks passed"

  # ─── Notify on failure — Slack (Q4d) ─────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: failure()

    steps:
      - name: Send Slack alert
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Security Alert — Travelo*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *Critical vulnerabilities detected*\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* `${{ github.sha }}`\n*Details:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View pipeline>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
