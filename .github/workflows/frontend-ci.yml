name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'travelo_frontend/**'
      - 'k8s/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend

jobs:

  # ─── JOB 1 — triggered by commit containing [build] ─────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelo_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./travelo_frontend
        run: npm ci

      - name: Build React app
        working-directory: ./travelo_frontend
        env:
          CI: false
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: travelo_frontend/build/
          retention-days: 1

  # ─── JOB 2 — triggered by commit containing [docker] ────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[docker]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./travelo_frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3 — triggered by commit containing [scan] ──────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[scan]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─── JOB 4 — triggered by commit containing [deploy] ────────────────────
  deploy:
    name: Update image tag for Argo CD
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy]')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update frontend image tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "Updating image tag to sha-${SHA}"
          sed -i "s|image: .*/travelo-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend:sha-${SHA}|g" \
            k8s/05-frontend-deployment.yml
          echo "Result:"
          grep "image:" k8s/05-frontend-deployment.yml

      - name: Commit and push
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/05-frontend-deployment.yml
          git diff --staged --quiet || git commit -m "ci: update frontend image to sha-${SHA} [skip ci]"
          git push
