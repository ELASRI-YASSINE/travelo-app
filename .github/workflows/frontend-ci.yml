name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend

jobs:

  # ─── JOB 1 — triggered by commit containing [build] ──────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelo_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./travelo_frontend
        run: npm ci

      - name: Build React app
        working-directory: ./travelo_frontend
        env:
          CI: false
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: travelo_frontend/build/
          retention-days: 1
   # ─── JOB 2 — triggered by commit containing [docker] ─────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[docker]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./travelo_frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ─── JOB 3 — triggered by commit containing [scan] ───────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[scan]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
  deploy:
    name: Update image tag and trigger Argo CD
    runs-on: ubuntu-latest
    needs: docker
    if: contains(github.event.head_commit.message, '[deploy]')

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v4

      - name: Update image tag in deployment
        run: |
          # Get the short SHA of the commit
          SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # Replace the image tag in the manifest
          sed -i "s|travelo-backend:.*|travelo-backend:sha-${SHA}|g" \
            ~/travelo-app/k8s/04-frontend-deployment.yml

      - name: Commit and push updated manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/04-backend-deployment.yml
          git commit -m "ci: update backend image to sha-${SHA}"
          git push
