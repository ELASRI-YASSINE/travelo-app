name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend

jobs:

  # ─── JOB 0 — Pre-commit checks (Q2) ──────────────────────────────────────
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  # ─── JOB 1 — triggered by [build] ────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: self-hosted
    needs: pre-commit
    if: contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                            # Q1c — caches node_modules
          cache-dependency-path: travelo_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./travelo_frontend
        run: npm ci

      - name: Build React app
        working-directory: ./travelo_frontend
        env:
          CI: false
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: travelo_frontend/build/
          retention-days: 1

  # ─── JOB 2 — triggered by [docker] (uses reusable workflow Q1d) ──────────
  docker:
    name: Docker Build & Push
    uses: ./.github/workflows/reusable-docker.yml   # Q1d — reusable job
    if: contains(github.event.head_commit.message, '[docker]')
    with:
      context: ./travelo_frontend
      image_name: ${{ vars.DOCKERHUB_USERNAME }}/travelo-frontend
    secrets: inherit

  # ─── JOB 3 — triggered by [scan] ─────────────────────────────────────────
  scan:
    name: Container Security Scan
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, '[scan]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─── JOB 4 — triggered by [deploy] ───────────────────────────────────────
  deploy:
    name: Update image tag for Argo CD
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, '[deploy]')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update frontend image tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|image: .*/travelo-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend:sha-${SHA}|g" \
            k8s/05-frontend-deployment.yml
          echo "Result:"
          grep "image:" k8s/05-frontend-deployment.yml

      - name: Commit and push
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/05-frontend-deployment.yml
          git diff --staged --quiet || git commit -m "ci: update frontend image to sha-${SHA} [skip ci]"
          git push
