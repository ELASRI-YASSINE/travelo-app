name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-frontend

jobs:

  # ─── JOB 1 — triggered by commit containing [build] ──────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travelo_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./travelo_frontend
        run: npm ci

      - name: Build React app
        working-directory: ./travelo_frontend
        env:
          CI: false
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: travelo_frontend/build/
          retention-days: 1
