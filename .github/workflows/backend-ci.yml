name: Backend CI Pipeline

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-backend

jobs:

  # ─── JOB 1 — triggered by commit containing [build] ──────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelo
          MYSQL_USER: travelo
          MYSQL_PASSWORD: travelo123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        working-directory: ./travelo_backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/travelo
          SPRING_DATASOURCE_USERNAME: travelo
          SPRING_DATASOURCE_PASSWORD: travelo123
        run: mvn package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: travelo_backend/target/*.jar
          retention-days: 1
  # ─── JOB 2 — triggered by commit containing [docker] ─────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[docker]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./travelo_backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
