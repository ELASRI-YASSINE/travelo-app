name: Backend CI Pipeline

on:
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelo-backend

jobs:

  # ─── JOB 0 — Pre-commit checks (Q2) ──────────────────────────────────────
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        # catches commits where developer used --no-verify locally

  # ─── JOB 1 — triggered by [build] ────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: self-hosted
    needs: pre-commit
    if: contains(github.event.head_commit.message, '[build]')

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelo
          MYSQL_USER: travelo
          MYSQL_PASSWORD: travelo123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven         # Q1c — caches ~/.m2 between runs

      - name: Build & Test
        working-directory: ./travelo_backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/travelo
          SPRING_DATASOURCE_USERNAME: travelo
          SPRING_DATASOURCE_PASSWORD: travelo123
        run: mvn package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: travelo_backend/target/*.jar
          retention-days: 1

  # ─── JOB 2 — triggered by [docker] (uses reusable workflow Q1d) ──────────
  docker:
    name: Docker Build & Push
    uses: ./.github/workflows/reusable-docker.yml   # Q1d — reusable job
    if: contains(github.event.head_commit.message, '[docker]')
    with:
      context: ./travelo_backend
      image_name: ${{ vars.DOCKERHUB_USERNAME }}/travelo-backend
    secrets: inherit

  # ─── JOB 3 — triggered by [scan] ─────────────────────────────────────────
  scan:
    name: Container Security Scan
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, '[scan]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'          # warn only here — hard block is in security-ci.yml
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─── JOB 4 — triggered by [deploy] ───────────────────────────────────────
  deploy:
    name: Update image tag for Argo CD
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, '[deploy]')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update backend image tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|image: elasriyassine/travelo-backend:.*|image: elasriyassine/travelo-backend:sha-${SHA}|g" \
            k8s/04-backend-deployment.yml
          echo "Updated to sha-${SHA}"
          grep "image:" k8s/04-backend-deployment.yml

      - name: Commit and push
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/04-backend-deployment.yml
          git diff --staged --quiet || git commit -m "ci: update backend image to sha-${SHA} [skip ci]"
          git push
